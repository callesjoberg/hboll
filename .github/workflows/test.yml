name: Tester

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Domain-, filter-, URL- och flödestester
        run: node --test tests/domain.test.mjs tests/app-flows.test.mjs
      - name: Data-smoke
        run: node tests/data-correctness-smoke.mjs
