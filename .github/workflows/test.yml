name: Tester

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Domain-, filter-, URL- och flödestester
        run: node --test tests/domain.test.mjs tests/app-flows.test.mjs
      - name: Data-smoke
        run: node tests/data-correctness-smoke.mjs
      - name: null får inte nå DOM-metoderna
        run: node tests/dom-null-guard.mjs
      - name: Modulgrafen länkar (exporter och importer finns)
        run: node tests/module-link.mjs
      - name: Väljarnas urval rörs bara som Set-liknande
        run: node tests/picker-selection-guard.mjs
      # Den enda spärren som faktiskt skyddar datan — förfalskade, utgångna
      # och främmande token ska avvisas, och serverfunktionen ska svara rätt.
      - name: Serverns inloggningskontroll
        run: node --test tests/server-auth.test.mjs
