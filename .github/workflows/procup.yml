name: Uppdatera cupdata

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Antal överlämningar i följd — sätts av loopen själv, lämna tom vid handstart"
        required: false
        default: "0"
      max_seconds:
        description: "Tak för loopen i sekunder. Bara för att prova överlämningen: sätt t.ex. 60 under matchtid så når första varvet taket direkt. Tom = 16200 (4 h 30 min)."
        required: false
        default: ""
  schedule:
    # Var 20:e minut — men GitHub kör schemalagda jobb "best effort" och
    # startar oss i praktiken bara var andra till var femte timme. Att be
    # om tätare cron ger inte en enda extra körning; det är därför
    # scripts/ci_update_loop.sh i stället låter EN körning stanna kvar och
    # jobba i femminuterstakt så länge det spelas matcher.
    #
    # scripts/_freshness.py håller ändå den effektiva kadensen nere per
    # cup: bara cuper inom/nära sitt eget kända matchfönster (73h innan
    # start till 24h efter sista matchen) skrapas varje varv. Cuper långt
    # fram i tiden kollas glest (~var 6:e timme), avslutade cuper trappar
    # av helt efter några uppföljningskontroller. Ingen extra kostnad att
    # köra tätt: publika repon har obegränsade Actions-minuter, och de
    # flesta varven gör inga nätverksanrop alls (should_refresh() säger
    # nej innan skrapningen ens börjar).
    - cron: "*/20 * * * *"

concurrency:
  group: update-cupdata
  cancel-in-progress: false

permissions:
  contents: write
  # actions: write krävs för att loopen ska kunna starta sin egen
  # efterträdare när den nått taket (gh workflow run i ci_update_loop.sh).
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ett varv = hela pipelinen plus en commit. Loopen fortsätter i
      # femminuterstakt så länge någon cup har matchtid, annars avslutas
      # den efter första varvet precis som förut. Taket ligger under
      # GitHubs sextimmarsgräns för ett jobb.
      - name: Skrapa, bygg och publicera (loopar under matchtid)
        timeout-minutes: 300
        env:
          LOOP_MAX_SECONDS: ${{ inputs.max_seconds || '16200' }}
          LOOP_PERIOD_SECONDS: "300"
          LOOP_CHAIN: ${{ inputs.chain || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci_update_loop.sh
